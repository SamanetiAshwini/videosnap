<!DOCTYPE html>
<html>
<head>
    <title>Product Details</title>
</head>
<body>

    <h1>Product Details</h1>

    <img src="{{ product.image.url }}" width="250" height="250">

    <h2>{{ product.name }}</h2>

    <p>Price: ₹{{ product.price }}</p>

    <p>{{ product.description }}</p>

    <br>

    <a href="{% url 'add_to_cart' product.id %}">
        Add to Cart
    </a>

    <br><br>

    <a href="{% url 'products' %}">
        Back to Products
    </a>

</body>
</html>
